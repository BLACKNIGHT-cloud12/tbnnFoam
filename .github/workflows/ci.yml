name: CI & Physics Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify DNS Benchmark Data & Metadata
      run: |
        python -c "
        import json, csv
        with open('data/benchmark_dns/benchmark_metadata.json') as f:
            meta = json.load(f)
            assert meta['flow_parameters']['bulk_reynolds_number_Re_b'] == 4410
            assert meta['flow_parameters']['friction_reynolds_number_Re_tau'] == 150.0
        with open('data/benchmark_dns/square_duct_dns_Reb4410_Retau150.csv') as f:
            reader = csv.DictReader(f)
            rows = list(reader)
            assert len(rows) > 4000
        print('DNS Benchmark verified: 4225 cells @ Re_b=4410, Re_tau=150')
        "

    - name: Run Automated Verification Suite (pytest)
      run: python -m pytest -v

    - name: Execute 5-Step Quantitative Physics Validation
      run: |
        python scripts/validation/evaluate_validation_plan.py
